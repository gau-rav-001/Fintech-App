services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smartfinance-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Gaurav@2004
      POSTGRES_DB: Smartfinance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Smartfinance"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis Cache / OTP Store ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smartfinance-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Node.js Express Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartfinance-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:Gaurav%402004@postgres:5432/Smartfinance
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: Smartfinance
      DB_USER: postgres
      DB_PASSWORD: Gaurav@2004
      DB_SSL: "false"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: 59e5dcdb899346b66427c4a4bb7f081199eb743b993c39b740fa18e44c1aee46a495b4d2643cf968f5d2fe15e599ee3137a80a649fd584069ae89ef0d5f3242e
      JWT_EXPIRES_IN: 1d
      CLIENT_URL: http://localhost:80
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AQ.Ab8RN6LxVwP0CvGXHDVrQYT23PV8tbFuzQezD6m9XOA7y31qDQ}
      GEMINI_MODEL_CHAT: gemini-2.5-flash
      GEMINI_MODEL_EMBEDDINGS: text-embedding-004
      SEED_ADMIN_EMAIL: kumbharegaurav100@gmail.com
      SEED_ADMIN_PASSWORD: Admin2024!
      SEED_ADMIN_NAME: Gaurav Kumbhare
      ADMIN_ALLOWED_EMAILS: kumbharegaurav100@gmail.com
    ports:
      - "5000:5000"

  # ── React + Vite Frontend (Nginx SPA) ────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartfinance-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"

volumes:
  pgdata:
  redisdata:
